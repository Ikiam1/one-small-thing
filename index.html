  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--font);
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    overflow: hidden; touch-action: manipulation;
  }

  /* ---------- background + glitter ---------- */

      radial-gradient(circle at 20% 6%, #fff 0, transparent 38%),
      linear-gradient(175deg, #ffe3f0, #ffcfe5 52%, #ffe0c8);

  @keyframes twinkle { from { opacity: .15; } to { opacity: 1; } }
  /* On the screens that are mostly text, keep the glitter away from the middle band */
  body[data-screen="start"] .sparkles,
  body[data-screen="reveal"] .sparkles,
  body[data-screen="done"] .sparkles {
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 16%, transparent 30%, transparent 72%, #000 86%, #000 100%);
            mask-image: linear-gradient(to bottom, #000 0%, #000 16%, transparent 30%, transparent 72%, #000 86%, #000 100%);
  }

  /* ---------- screens ---------- */
  .screen {
    position: absolute; inset: 0; z-index: 5;
    padding: calc(28px + env(safe-area-inset-top, 0px)) 28px calc(28px + env(safe-area-inset-bottom, 0px));
    display: none; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 20px;
  }
  .screen.active { display: flex; }
  h1 { font-size: clamp(2rem, 9vw, 2.8rem); line-height: 1.08; margin: 0; font-weight: 700; letter-spacing: -0.005em; }
  p { margin: 0; color: var(--muted); font-size: 1.05rem; line-height: 1.5; max-width: 30ch; }
  .emoji-row { font-size: 2.2rem; letter-spacing: .35em; padding-left: .35em; }

  button { font-family: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--c2); outline-offset: 3px; }
  .cta {
    background: var(--c1); color: #fff; border: 0; border-radius: 14px;
    padding: 16px 34px; font-size: 1.15rem; font-weight: 700;
  }
  .cta:active { transform: scale(.97); }
  .ghost { background: none; border: 0; color: var(--muted); font-size: .95rem; padding: 10px 14px; text-decoration: underline; text-underline-offset: 4px; }

  /* ---------- game ---------- */
  #game { justify-content: space-between; gap: 10px; }
  .hud { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 10px; align-items: center; padding-top: 6px; }
  #prog { display: flex; gap: 10px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--muted); transition: background .3s, border-color .3s; }
  .dot.now { border-color: var(--ink); }
  .dot.done { border-color: transparent; }
  .dot.done:nth-child(1) { background: var(--c1); }
  .dot.done:nth-child(2) { background: var(--c2); }
  .dot.done:nth-child(3) { background: var(--c3); }
  #status { font-size: 1.25rem; font-weight: 600; min-height: 1.6em; }

  .pads {
    width: 100%; max-width: 420px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; aspect-ratio: 1 / 1;
  }
  .pad {
    --c: var(--c1);
    background: rgba(255,255,255,.78); border: 4px solid var(--c); border-radius: 26px;
    font-size: clamp(3rem, 16vw, 4.6rem); display: grid; place-items: center; padding: 0;
    transition: background .08s, box-shadow .08s, transform .08s;
  }
  .pad:nth-child(1) { --c: var(--c1); }
  .pad:nth-child(2) { --c: var(--c2); }
  .pad:nth-child(3) { --c: var(--c3); }
  .pad:nth-child(4) { --c: var(--c4); }
  .pad.lit { background: var(--c); box-shadow: 0 0 36px var(--c); transform: scale(.96); }
  .pad.hint { animation: hint .9s ease-in-out infinite; }
  @keyframes hint { 50% { box-shadow: 0 0 26px var(--c); } }
  .pads.glow .pad { box-shadow: 0 0 22px var(--c); }
  .pads.locked .pad { pointer-events: none; }
  .pads.shake { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  /* trivia (Chega de Saudade) */
  #trivia { display: none; flex-direction: column; align-items: center; justify-content: center; gap: 22px; width: 100%; max-width: 360px; flex: 1; }
  .mode-trivia #pads { display: none; }
  .mode-trivia #trivia { display: flex; }
  #pulse { font-size: 5rem; line-height: 1; transition: transform .12s; }
  #pulse.beat { transform: scale(1.18); }
  #opts { display: flex; flex-direction: column; gap: 12px; width: 100%; }
  .opt {
    background: rgba(255,255,255,.8); border: 2px solid var(--muted); color: var(--ink);
    border-radius: 14px; padding: 15px 18px; font-size: 1.1rem; font-weight: 600; text-align: center;
    transition: opacity .2s, background .2s, border-color .2s;
  }
  .opt:active { transform: scale(.98); }
  .opt.out { opacity: .3; text-decoration: line-through; pointer-events: none; }
  .opt.right { background: var(--c1); border-color: var(--c1); color: #fff; }

  #songcard {
    min-height: 76px; opacity: 0; transform: translateY(6px); transition: opacity .5s, transform .5s;
    padding: 10px 22px; border-radius: 16px;
    background: rgba(255,240,247,.8); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  #songcard.show { opacity: 1; transform: none; }
  #songcard .t { font-size: 1.6rem; font-weight: 700; }
  #songcard .a { color: var(--muted); font-size: .95rem; margin-top: 2px; }
  #replay { visibility: hidden; }
  #replay.show { visibility: visible; }

  /* ---------- reveal / finale ---------- */
  #hai {
    background: linear-gradient(135deg, var(--c1), var(--c3)); color: #fff; border: 0; border-radius: 20px;
    padding: 20px 56px; font-size: 1.9rem; font-weight: 700;
    box-shadow: 0 8px 36px rgba(255,45,149,.4);
  }
  #hai small { display: block; font-size: .8rem; font-weight: 600; opacity: .85; }
  #hai:active { transform: scale(.97); }

  .skie {
    position: absolute; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    width: min(34vw, 150px); aspect-ratio: 292 / 300; pointer-events: none;
    background: var(--skie) center / contain no-repeat;
  }
  #done .skie { width: min(46vw, 210px); }

  #sad { position: absolute; inset: 0; display: none; background: rgba(40,10,35,.9); align-items: center; justify-content: center; flex-direction: column; gap: 16px; text-align: center; padding: 24px; color: #fff; z-index: 20; }
  #sad.show { display: flex; }
  #sad .big { font-size: 4rem; }

  .fall { position: absolute; top: -10%; font-size: 2rem; pointer-events: none; animation: fall linear forwards; z-index: 4; }
  @keyframes fall { to { transform: translateY(115vh) rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .pad.hint, .pads.shake, .sparkles::before, .sparkles::after { animation: none; }
    .fall { display: none; }
  }
</style>
</head>
<body data-screen="start">
<div class="bg" aria-hidden="true"></div>
<div class="sparkles" aria-hidden="true"></div>

<!-- 1. Start (this tap also unlocks audio on iPhone) -->
<section id="start" class="screen active">
  <div class="emoji-row">🥰😈🔫🦾</div>
  <h1>One small thing before the last page</h1>
  <p>Three songs. You can't lose. Turn your sound on.</p>
  <button class="cta" id="startBtn">Tap to start</button>
</section>

<!-- 2. Game -->
<section id="game" class="screen">
  <div class="hud">
    <div id="prog"></div>
    <div id="status" aria-live="polite"></div>
  </div>
  <div class="pads locked" id="pads"></div>
  <div id="trivia">
    <div id="pulse" aria-hidden="true">🥰</div>
    <div id="opts"></div>
  </div>
  <div id="songcard"><div class="t" id="scTitle">&nbsp;</div><div class="a" id="scArtist">&nbsp;</div></div>
  <button class="ghost" id="replay">Listen again</button>
</section>

<!-- 3. Unlocked -->
<section id="reveal" class="screen">
  <div class="emoji-row">🥰😈🔫🦾</div>
  <h1>Last page unlocked</h1>
  <p>The question is on the paper. Your answer is here.</p>
  <button id="hai">はい<small>hai</small></button>
  <button class="ghost" id="iie">いいえ · iie</button>
  <div class="skie" role="img" aria-label="Skie plush"></div>
</section>

<!-- 4. Finale -->
<section id="done" class="screen">
  <div class="emoji-row">🥰😈🔫🦾</div>
  <h1>はい!</h1>
  <p>Tiernos. Safados. Bounty hunters. サイバーサイコ (cyber psychos).</p>
  <p>彼女 (kanojo) &amp; 彼氏 (kareshi)</p>
  <div class="skie" role="img" aria-label="Skie plush"></div>
</section>

<div id="sad">
  <div class="big">🥺</div>
  <h1 style="font-size:1.8rem">Are you sure?</h1>
  <button class="cta" id="sadBack">Let me think again</button>
</div>

<script>
(function () {
  "use strict";

  /* =================== SONGS (read from your MuseScore images) ===================
     pads : the four notes, low to high, for 🥰 😈 🔫 🦾 (reading order: top-left, top-right, bottom-left, bottom-right).
     simon: the attacks she repeats, in stages (how many notes each stage has).
     full : the whole phrase played as a reward: [note, start, length], in QUARTER-note beats (ties already merged).
     beatMs: milliseconds per quarter note (bigger = slower).  */
  const SONGS = [
    {
      id: "caju", mode: "simon", title: "Caju", artist: "Liniker", beatMs: 670,
      pads: ["G4", "A4", "B4", "D5"],
      simon: { stages: [4, 8], seq: ["D5", "D5", "G4", "A4", "G4", "A4", "G4", "A4"] },
      full: [
        ["D5",0,.5],["D5",.5,.5],
        ["G4",1,.5],["A4",1.5,1],["G4",2.5,.5],["A4",3,1],["G4",4,.5],["A4",4.5,1],
        ["G4",5.5,.25],["A4",5.75,.5],["G4",6.25,.25],["A4",6.5,.5],
        ["B4",7,.25],["G4",7.25,.5],["A4",7.75,.75]
      ]
    },
    {
      // "This happens once every few lifetimes": 6 different notes, but the Simon only repeats the first four (a descending line).
      id: "alchemy", mode: "simon", title: "The Alchemy", artist: "Taylor Swift", beatMs: 620,
      pads: ["G4", "A4", "B4", "C5"],
      simon: { stages: [3, 4], seq: ["C5", "B4", "A4", "G4"] },
      full: [
        ["C5",0,1],
        ["B4",1,.5],["A4",1.5,.5],["G4",2,1],["G4",3,.5],["E4",3.5,.5],["G4",4,1],
        ["A4",5,2],["C4",7,1]
      ]
    },
    {
      id: "chega", mode: "trivia", title: "Chega de Saudade", artist: "Tom Jobim · Vinicius de Moraes", beatMs: 400,
      decoys: ["Carinhosamente", "Desmitificar"],   // edit these; the right answer is the title above
      full: [
        ["D4",0,1],["E4",1,1],["D4",2,.5],["C#4",2.5,1],["D4",3.5,1],["F4",4.5,1],
        ["G#4",5.5,1],["C#5",6.5,1],["B4",7.5,1],["A4",8.5,1],["G4",9.5,1],["B3",10.5,2.5]
      ]
    }
  ];
  const EMOJI = ["🥰", "😈", "🔫", "🦾"];
  const SIMON_MS = 520;       // time between notes when she is shown the sequence
  const HINT_AFTER = 2;       // mistakes in a stage before the next pad starts to glow

  /* =================== helpers =================== */
  const $ = (id) => document.getElementById(id);
  const screens = ["start", "game", "reveal", "done"];
  const SEMI = { "C":0,"C#":1,"D":2,"D#":3,"E":4,"F":5,"F#":6,"G":7,"G#":8,"A":9,"A#":10,"B":11 };
  function freq(n) {
    const m = n.match(/^([A-G]#?)(\d)$/);
    return 440 * Math.pow(2, (SEMI[m[1]] + (parseInt(m[2], 10) + 1) * 12 - 69) / 12);
  }

  let ctx = null, timers = [], busy = false;
  let si = 0, stage = 0, pos = 0, mistakes = 0, seq = [];
  let padIndex = {}, padEls = [];

  function later(fn, ms) { const t = setTimeout(fn, ms); timers.push(t); return t; }
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }
  function show(id) {
    screens.forEach((s) => $(s).classList.toggle("active", s === id));
    document.body.dataset.screen = id;
  }
  function status(t) { $("status").textContent = t; }

  /* =================== audio =================== */
  function ensureAudio() {
    if (!ctx) { const AC = window.AudioContext || window.webkitAudioContext; ctx = new AC(); }
    if (ctx.state === "suspended") ctx.resume();
  }
  function tone(hz, dur) {
    if (!ctx) return;
    const t = ctx.currentTime;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.32, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    g.connect(ctx.destination);
    [["sine", 1, 1], ["triangle", 1, 0.22], ["sine", 2, 0.1]].forEach(([type, mult, vol]) => {
      const o = ctx.createOscillator(), og = ctx.createGain();
      og.gain.value = vol; o.type = type; o.frequency.value = hz * mult;
      o.connect(og); og.connect(g); o.start(t); o.stop(t + dur + 0.05);
    });
  }

  /* =================== pads =================== */
  const flashT = {};
  function flashNote(note, ms) {
    const i = padIndex[note], grid = $("pads");
    if (i === undefined) {            // a note with no pad: softly glow the whole grid
      grid.classList.add("glow");
      clearTimeout(flashT.glow);
      flashT.glow = setTimeout(() => grid.classList.remove("glow"), ms);
      return;
    }
    const el = padEls[i];
    el.classList.add("lit");
    clearTimeout(flashT[i]);
    flashT[i] = setTimeout(() => el.classList.remove("lit"), ms);
  }
  function buildPads(song) {
    const grid = $("pads");
    grid.innerHTML = ""; padEls = []; padIndex = {};
    if (!song.pads) return;
    song.pads.forEach((note, i) => {
      const b = document.createElement("button");
      b.className = "pad"; b.textContent = EMOJI[i]; b.setAttribute("aria-label", "Pad " + (i + 1));
      b.addEventListener("pointerdown", (e) => { e.preventDefault(); onPad(i); });
      grid.appendChild(b); padEls.push(b); padIndex[note] = i;
    });
  }
  function clearHints() { padEls.forEach((el) => el.classList.remove("hint")); }

  function setProg() {
    const p = $("prog"); p.innerHTML = "";
    SONGS.forEach((_, i) => {
      const d = document.createElement("span");
      d.className = "dot" + (i < si ? " done" : i === si ? " now" : "");
      p.appendChild(d);
    });
  }
  function songcard(song, on) {
    $("scTitle").textContent = on ? "♪ " + song.title : "\u00a0";
    $("scArtist").textContent = on ? song.artist : "\u00a0";
    $("songcard").classList.toggle("show", !!on);
  }

  /* =================== play the full phrase =================== */
  function playFull(song, done) {
    const lead = 500, beat = song.beatMs;
    busy = true;
    $("pads").classList.add("locked");
    $("replay").classList.remove("show");
    song.full.forEach(([note, start, len]) => {
      later(() => {
        tone(freq(note), Math.max(0.22, (len * beat * 1.2) / 1000));
        if (song.mode === "simon") flashNote(note, Math.min(len * beat * 0.8, 240));
        else pulse();
      }, lead + start * beat);
    });
    const last = song.full[song.full.length - 1];
    later(() => { if (done) done(); }, lead + (last[1] + last[2]) * beat + 900);
  }
  function pulse() {
    const p = $("pulse"); p.classList.add("beat");
    setTimeout(() => p.classList.remove("beat"), 110);
  }

  /* =================== flow =================== */
  function startSong(i) {
    clearTimers();
    si = i; stage = 0; pos = 0; mistakes = 0;
    const song = SONGS[si];
    $("game").classList.toggle("mode-trivia", song.mode === "trivia");
    buildPads(song); setProg(); songcard(song, false);
    $("replay").classList.remove("show");
    show("game");
    status("Song " + (si + 1) + " of 3");
    later(song.mode === "simon" ? startStage : startTrivia, 900);
  }

  /* ---- Simon ---- */
  function startStage() {
    const song = SONGS[si];
    seq = song.simon.seq.slice(0, song.simon.stages[stage]);
    mistakes = 0; pos = 0;
    playSeq();
  }
  function playSeq() {
    clearTimers(); clearHints();
    busy = true; $("pads").classList.add("locked");
    $("replay").classList.remove("show");
    status("Listen…");
    seq.forEach((note, k) => later(() => { tone(freq(note), 0.42); flashNote(note, 300); }, 500 + k * SIMON_MS));
    later(() => {
      busy = false; pos = 0;
      $("pads").classList.remove("locked");
      $("replay").classList.add("show");
      status("Your turn");
      updateHint();
    }, 500 + seq.length * SIMON_MS + 150);
  }
  function updateHint() {
    clearHints();
    if (mistakes >= HINT_AFTER && padIndex[seq[pos]] !== undefined) padEls[padIndex[seq[pos]]].classList.add("hint");
  }
  function onPad(i) {
    if (busy || SONGS[si].mode !== "simon") return;
    ensureAudio();
    const song = SONGS[si], note = song.pads[i], expected = seq[pos];
    if (note === expected) {
      tone(freq(note), 0.45); flashNote(note, 260);
      pos++; updateHint();
      if (pos >= seq.length) {
        busy = true; clearHints(); $("replay").classList.remove("show");
        stage++;
        if (stage < song.simon.stages.length) { status("Nice. A little longer"); later(startStage, 1200); }
        else later(solved, 500);
      }
    } else {
      mistakes++;
      const g = $("pads"); g.classList.remove("shake"); void g.offsetWidth; g.classList.add("shake");
      status("Almost. Listen again");
      busy = true; g.classList.add("locked");
      later(playSeq, 800);
    }
  }

  /* ---- Trivia ---- */
  function startTrivia() {
    const song = SONGS[si];
    const opts = [song.title].concat(song.decoys).sort(() => Math.random() - 0.5);
    const box = $("opts"); box.innerHTML = "";
    opts.forEach((name) => {
      const b = document.createElement("button");
      b.className = "opt"; b.textContent = name;
      b.addEventListener("click", () => onOpt(b, name === song.title));
      box.appendChild(b);
    });
    status("Do you know this one?");
    $("replay").classList.add("show");
    playFull(song, () => { busy = false; });
  }
  function onOpt(btn, ok) {
    ensureAudio();
    if (ok) {
      clearTimers(); busy = true;
      btn.classList.add("right");
      document.querySelectorAll(".opt").forEach((o) => { if (o !== btn) o.classList.add("out"); });
      $("replay").classList.remove("show");
      solved();
    } else {
      btn.classList.add("out");
      status("Not that one. Listen again");
    }
  }

  /* ---- solved: show the name, play the whole phrase, move on ---- */
  function solved() {
    const song = SONGS[si];
    songcard(song, true);
    status("That's the song 🥰");
    playFull(song, () => {
      if (si < SONGS.length - 1) startSong(si + 1);
      else finishGame();
    });
  }
  function finishGame() {
    clearTimers();
    [["G4", 0], ["D5", 160]].forEach(([n, ms]) => later(() => tone(freq(n), 0.9), ms));
    show("reveal");
  }

  /* ---- finale ---- */
  function confetti() {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    for (let i = 0; i < 36; i++) {
      const s = document.createElement("span");
      s.className = "fall";
      s.textContent = EMOJI[i % 4];
      s.style.left = Math.random() * 94 + "vw";
      s.style.animationDuration = 2.4 + Math.random() * 2.4 + "s";
      s.style.animationDelay = Math.random() * 1.2 + "s";
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 7000);
    }
  }

  /* =================== wiring =================== */
  $("startBtn").addEventListener("click", () => { ensureAudio(); startSong(0); });
  $("replay").addEventListener("click", () => {
    ensureAudio();
    const song = SONGS[si];
    if (song.mode === "simon") playSeq();
    else { clearTimers(); busy = true; playFull(song, () => { busy = false; }); }
  });
  $("hai").addEventListener("click", () => {
    ensureAudio(); show("done"); confetti();
    [["C4",0],["E4",130],["G4",260],["C5",390]].forEach(([n, ms]) => setTimeout(() => tone(freq(n), 0.7), ms));
  });
  $("iie").addEventListener("click", () => $("sad").classList.add("show"));
  $("sadBack").addEventListener("click", () => $("sad").classList.remove("show"));
})();
</script>
</body>
</html>
